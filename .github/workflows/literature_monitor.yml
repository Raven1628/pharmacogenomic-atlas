name: 📚 Weekly Pharmacogenomic Literature Monitor

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Days to look back'
        required: false
        default: '7'
        type: choice
        options:
          - '7'
          - '14'
          - '30'

jobs:
  check-literature:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
    
    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 📦 Install dependencies
      run: |
        pip install requests pandas
    
    - name: 🔍 Run literature monitor
      run: |
        python auto_update_literature.py
    
    - name: 📊 Check for updates
      id: check
      run: |
        if [ -f "data/processed/literature_updates.csv" ]; then
          COUNT=$(wc -l < data/processed/literature_updates.csv)
          COUNT=$((COUNT - 1))  # Subtract header line
          echo "updates_found=true" >> $GITHUB_OUTPUT
          echo "update_count=$COUNT" >> $GITHUB_OUTPUT
          echo "📚 Found $COUNT new articles"
        else
          echo "updates_found=false" >> $GITHUB_OUTPUT
          echo "✅ No new articles found"
        fi
    
    - name: 📎 Upload literature report
      uses: actions/upload-artifact@v4
      with:
        name: literature-updates
        path: |
          data/processed/literature_updates.csv
          data/processed/literature_report.md
          data/processed/literature_updates.json
        retention-days: 30
    
    - name: 📝 Create GitHub Issue
      if: steps.check.outputs.updates_found == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let report = '';
          try {
            report = fs.readFileSync('data/processed/literature_report.md', 'utf8');
          } catch(e) {
            report = 'New pharmacogenomic literature has been found. Please review and update drug_config.py if needed.';
          }
          
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `📚 New Pharmacogenomic Literature Available (${new Date().toISOString().slice(0,10)})`,
            body: `${report}\n\n---\n*Auto-generated by weekly literature monitor*`,
            labels: ['literature-update', 'needs-review']
          });
    
    - name: 💬 Post summary to job summary
      run: |
        if [ -f "data/processed/literature_report.md" ]; then
          echo "# Literature Monitor Results" >> $GITHUB_STEP_SUMMARY
          cat data/processed/literature_report.md >> $GITHUB_STEP_SUMMARY
        else
          echo "# Literature Monitor Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ No new pharmacogenomic literature found in the last 7 days." >> $GITHUB_STEP_SUMMARY
        fi
